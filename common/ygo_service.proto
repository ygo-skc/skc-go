syntax = "proto3";

option go_package = "/ygo";
package ygo;

import "common.proto";
import "google/protobuf/wrappers.proto";

service CardService {
  rpc GetCardColors(GetCardColorsRequest) returns (GetCardColorsResponse);

  rpc GetCardByID(GetCardByIDRequest) returns (GetCardByIDResponse);
  rpc GetCardsByID(GetCardsByIDRequest) returns (GetCardsByIDResponse);

  rpc GetCardsByName(GetCardsByNameRequest) returns (GetCardsByNameResponse);

  rpc GetCardsReferencingNameInEffect(GetCardsReferencingNameInEffectRequest) returns (GetCardsReferencingNameInEffectResponse);

  rpc GetArchetypalCardsUsingCardName(GetArchetypalCardsUsingCardNameRequest) returns (GetArchetypalCardsUsingCardNameResponse);
  rpc GetExplicitArchetypalInclusions(GetExplicitArchetypalInclusionsRequest) returns (GetExplicitArchetypalInclusionsResponse);
  rpc GetExplicitArchetypalExclusions(GetExplicitArchetypalExclusionsRequest) returns (GetExplicitArchetypalExclusionsResponse);

  rpc GetRandomCard(GetRandomCardRequest) returns (GetRandomCardResponse);
}

message GetCardColorsRequest {}

message GetCardColorsResponse {
  map<string, uint32> values = 1;
}

message GetCardByIDRequest {
    ygo.ResourceID subject = 1;
}

message GetCardByIDResponse {
    Card card = 1;
}

message GetCardsByIDRequest {
    ygo.ResourceIDs subjects = 1;
}

message GetCardsByIDResponse {
    Cards cards = 1;
}

message GetCardsByNameRequest {
    ygo.ResourceNames subjects = 1;
}

message GetCardsByNameResponse {
    Cards cards = 1;
}

message GetCardsReferencingNameInEffectRequest {
    ygo.ResourceNames subjects = 1;
}

message GetCardsReferencingNameInEffectResponse {
    CardList cards = 1;
}

message GetArchetypalCardsUsingCardNameRequest {
    ygo.Archetype subject = 1;
}

message GetArchetypalCardsUsingCardNameResponse {
    CardList cards = 1;
}

message GetExplicitArchetypalInclusionsRequest {
    ygo.Archetype subject = 1;
}

message GetExplicitArchetypalInclusionsResponse {
    CardList cards = 1;
}

message GetExplicitArchetypalExclusionsRequest {
    ygo.Archetype subject = 1;
}

message GetExplicitArchetypalExclusionsResponse {
    CardList cards = 1;
}

message GetRandomCardRequest {
    ygo.BlackListed blacklist = 1;
}

message GetRandomCardResponse {
    Card card = 1;
}

service ProductService {
	rpc GetCardsByProductID(GetCardsByProductIDRequest) returns (GetCardsByProductIDResponse);

	rpc GetProductSummaryByID(GetProductSummaryByIDRequest) returns (GetProductSummaryByIDResponse);
	rpc GetProductsSummaryByID(GetProductsSummaryByIDRequest) returns (GetProductsSummaryByIDResponse);
}

message GetCardsByProductIDRequest {
    ygo.ResourceID subject = 1;
}

message GetCardsByProductIDResponse {
    Product product = 1;
}

message GetProductSummaryByIDRequest {
    ygo.ResourceID subject = 1;
}

message GetProductSummaryByIDResponse {
    ProductSummary product_summary = 1;
}

message GetProductsSummaryByIDRequest {
    ygo.ResourceIDs subjects = 1;
}

message GetProductsSummaryByIDResponse {
    Products products = 1;
}

service CardRestrictionService {
	rpc GetEffectiveTimelineForFormat(Format) returns (ygo.EffectiveTimeline);
}

service ScoreService {
	rpc GetScoresByFormatAndDate(RestrictedContentRequest) returns (ScoresForFormatAndDate);

	rpc GetCardScoreByID(ygo.ResourceID) returns (CardScore);
  	rpc GetCardScoresByIDs(GetCardScoresByIDsRequest) returns (GetCardScoresByIDsResponse);
}

message GetCardScoresByIDsRequest {
    ygo.ResourceIDs subjects = 1;
}

message GetCardScoresByIDsResponse {
    CardScores scores = 1;
}

message Card {
  string id = 1;
  string color = 2;
  string name = 3;
  string attribute = 4;
  string effect = 5;
  google.protobuf.StringValue monster_type = 6 [json_name = "monsterType"];
  google.protobuf.UInt32Value attack = 7;
  google.protobuf.UInt32Value defense = 8;
}

message Cards {
	map<string, Card> card_info = 1;
	repeated string unknown_resources = 2;
}

message CardList {
	repeated Card cards = 1;
}

message Product {
  string id = 1;
  string locale = 2;
  string name = 3;
  string type = 4;
  string sub_type = 5;
  string release_date = 6;
  uint32 total_items = 7;
  repeated ProductItem items = 8;
  map<string, uint32> rarity_distribution = 9;
}

message ProductItem {
  Card card = 1;
  string position = 2;
  repeated string rarities = 3;
}

message ProductSummary {
  string id = 1;
  string locale = 2;
  string name = 3;
  string type = 4;
  string sub_type = 5;
  string release_date = 6;
  uint32 total_items = 7;
}

message Products {
	map<string, ProductSummary> products = 1;
	repeated string unknown_resources = 2;
}

message Format {
	string value = 1;
}

message RestrictedContentRequest {
	string format = 1;
	string effective_date = 2;
	ygo.CardRestrictionSortOrder sort_order = 3;
}

// score specific data types

message ScoresForFormatAndDate {
	string format = 1;
	string effective_date = 2;
	google.protobuf.StringValue next_format_date = 3;
	google.protobuf.StringValue previous_format_date = 4;
	repeated CardScoreEntry entries = 5;
	uint32 total_entries = 6;
}

message CardScoreEntry {
	Card card = 1;
	uint32 score = 2;
}

message CardScore {
  map<string, uint32> current_score_by_format = 1;
  repeated string unique_formats = 2;
  repeated ScoreEntry score_history = 3;
  repeated string scheduled_changes = 4;;
}

message CardScores {
	map<string, CardScore> card_info = 1;
	repeated string unknown_resources = 2;
}

message ScoreEntry {
	string format = 1;
	string effective_date = 2;
	uint32 score = 3;
}
