services:
  ygo-service:
    image: alpine:latest
    command: ./ygo-service
    working_dir: /app
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "9020:9020"
    volumes:
      - "./ygo-service:/app/ygo-service:ro"
      - "./certs/certificate.crt:/app/certs/certificate.crt:ro"
      - "./certs/ca_bundle.crt:/app/certs/ca_bundle.crt:ro"
      - "./certs/private.key:/app/certs/private.key:ro"
      - "./.env_prod:/app/.env_prod:ro"
    tmpfs:
      - /app/certs:size=64k,mode=0700,uid=1000,gid=1000 # app writes concatenated.crt here at startup
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9020"] # checks tcp only
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    memswap_limit: 50m # go's GC doesn't utilize swap well
    deploy:
      resources:
        limits:
          memory: 50m
    networks:
      - skc
    environment:
      - YGO_SERVICE_DOT_ENV_FILE=.env_prod
      - GOMEMLIMIT=40MiB
    labels:
      com.datadoghq.tags.runtime: "golang"
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port": "%%port%%"}]'
      com.datadoghq.ad.logs: >-
        [{
          "source": "go",
          "service": "ygo-service",
          "log_processing_rules": [{
            "type": "exclude_at_match",
            "name": "exclude_health_check",
            "pattern" : "\"app.flow\":\"Status\""
          }]
        }]
      com.datadoghq.tags.env: "prod"
      com.datadoghq.tags.service: "ygo-service"

networks:
  skc:
    name: skc
    driver: bridge
    external: true # network was already created, if you need to recreate the network - make this false
